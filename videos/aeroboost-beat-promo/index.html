<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-f1"
        class="frame"
        data-composition-id="01-f1"
        data-composition-src="compositions/frames/01-f1.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-f2"
        class="frame"
        data-composition-id="02-f2"
        data-composition-src="compositions/frames/02-f2.html"
        data-start="4"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-03-f3"
        class="frame"
        data-composition-id="03-f3"
        data-composition-src="compositions/frames/03-f3.html"
        data-start="12"
        data-duration="2"
        data-track-index="1"
      ></div>

      <div
        id="el-04-f4"
        class="frame"
        data-composition-id="04-f4"
        data-composition-src="compositions/frames/04-f4.html"
        data-start="14"
        data-duration="2"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio id="el-bgm" src="assets/bgm.mp3" data-start="0" data-duration="16"
        data-track-index="11" data-volume="0.9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
