  <body>
    <template>
      <style>

      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/Barlow-700.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 800; src: url("assets/fonts/Barlow-800.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 900; src: url("assets/fonts/Barlow-900.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      #f3-root { position: absolute; inset: 0; overflow: hidden; background: #111111; font-family: "Barlow", sans-serif; }
      #f3-root .f3-k { position: absolute; left: 72px; right: 72px; top: 560px; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; color: #888880; }
      #f3-root .f3-slot { position: absolute; left: 40px; right: 40px; top: 700px; height: 420px; display: flex; align-items: center; justify-content: center; }
      #f3-root .f3-w { position: absolute; width: 100%; text-align: center; font-weight: 900; font-size: 200px; line-height: 0.88; letter-spacing: -0.045em; color: #F0ECE5; text-transform: lowercase; opacity: 0; }
      #f3-root #f3-final { color: #E85D26; font-size: 176px; }
      #f3-root #f3-rule { position: absolute; left: 504px; top: 1180px; width: 72px; height: 6px; background: #E85D26; opacity: 0; }
      </style>
      <div id="f3-root" data-composition-id="03-f3" data-width="1080" data-height="1920" data-duration="2">
        <div class="f3-k">una sola máquina para</div>
        <div class="f3-slot">
          <div class="f3-w" id="f3-w0">auto</div>
          <div class="f3-w" id="f3-w1">sillón</div>
          <div class="f3-w" id="f3-w2">teclado</div>
          <div class="f3-w" id="f3-w3">mascotas</div>
          <div class="f3-w" id="f3-w4">guantera</div>
          <div class="f3-w" id="f3-final">todo en uno</div>
        </div>
        <div id="f3-rule"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const words = ["#f3-w0", "#f3-w1", "#f3-w2", "#f3-w3", "#f3-w4"];
        const all = words.concat(["#f3-final"]);
        // accelerating flipbook across the roll (gaps shrink), resolves at track 13.42
        const flips = [0.0, 0.28, 0.5, 0.68, 0.75, 0.86, 0.96, 1.05, 1.13, 1.2, 1.27, 1.34];
        flips.forEach((t, i) => {
          tl.set(all, { opacity: 0 }, t);
          tl.set(words[i % words.length], { opacity: 1 }, t);
        });
        tl.set(all, { opacity: 0 }, 1.42);
        tl.set("#f3-final", { opacity: 1 }, 1.42);
        tl.fromTo("#f3-final", { scale: 1.25 }, { scale: 1, duration: 0.08, ease: "power4.out" }, 1.42);
        tl.set("#f3-rule", { opacity: 1 }, 1.42);
        // freeze-hold through the silence (13.5 → 14.0): nothing moves
        tl.seek(0);
        window.__timelines["03-f3"] = tl;
      </script>
    </template>
