  <body>
    <template>
      <style>

      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/Barlow-700.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 800; src: url("assets/fonts/Barlow-800.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 900; src: url("assets/fonts/Barlow-900.woff2") format("woff2"); }

      #f4-root { position: absolute; inset: 0; overflow: hidden; background: #111111; font-family: "Barlow", sans-serif; }
      #f4-root #f4-photo { position: absolute; left: 220px; top: 270px; width: 640px; height: 640px; background: #F0ECE5; overflow: hidden; }
      #f4-root #f4-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #f4-root .f4-name { position: absolute; left: 72px; right: 72px; top: 945px; text-align: center; font-weight: 700; font-size: 64px; line-height: 1.1; letter-spacing: -0.02em; color: #F0ECE5; text-transform: lowercase; }
      #f4-root .f4-price { position: absolute; left: 0; right: 0; top: 1050px; text-align: center; font-weight: 900; font-size: 230px; line-height: 1; letter-spacing: -0.04em; color: #E85D26; }
      #f4-root .f4-cta-wrap { position: absolute; left: 0; right: 0; top: 1340px; display: flex; justify-content: center; }
      #f4-root #f4-cta { display: block; padding: 26px 64px; background: #E85D26; color: #111111; font-weight: 900; font-size: 76px; line-height: 1; letter-spacing: -0.03em; text-transform: lowercase; }
      #f4-root #f4-flash { position: absolute; inset: 0; background: #F0ECE5; opacity: 0; }
      </style>
      <div id="f4-root" data-composition-id="04-f4" data-width="1080" data-height="1920" data-duration="2">
        <div id="f4-photo"><img id="f4-img" data-layout-allow-overflow src="assets/public/asp-estudio.jpg" alt="AeroBoost 3 en 1" /></div>
        <div class="f4-name" id="f4-name">aeroboost 3 en 1</div>
        <div class="f4-price" id="f4-price">$24.990</div>
        <div class="f4-cta-wrap"><div id="f4-cta">pídela hoy →</div></div>
        <div id="f4-flash"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // final SURGE (track 14.0): flash + price braam
        tl.fromTo("#f4-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.3, ease: "power3.out" }, 0);
        tl.fromTo("#f4-price", { scale: 0.55 }, { scale: 1, duration: 0.55, ease: "elastic.out(1, 0.5)" }, 0);
        tl.fromTo("#f4-photo", { scale: 1.12, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.03);
        tl.fromTo("#f4-img", { scale: 1.12 }, { scale: 1.0, duration: 2.0, ease: "power1.out" }, 0);
        tl.fromTo("#f4-name", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.12);
        // CTA pops on the stinger (track 15.0), small pulse on 15.21, then holds
        tl.fromTo("#f4-cta", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2.6)" }, 0.96);
        tl.to("#f4-cta", { scale: 1.06, duration: 0.09, ease: "power2.out" }, 1.21);
        tl.to("#f4-cta", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 1.3);
        tl.seek(0);
        window.__timelines["04-f4"] = tl;
      </script>
    </template>
