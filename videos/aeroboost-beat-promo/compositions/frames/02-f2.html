<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
      @font-face { font-family: "Barlow"; font-weight: 400; src: url("assets/fonts/Barlow-400.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/Barlow-700.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 800; src: url("assets/fonts/Barlow-800.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 900; src: url("assets/fonts/Barlow-900.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      #f2-root { position: absolute; inset: 0; overflow: hidden; background: #111111; font-family: "Barlow", sans-serif; }
      /* g1 — orange register hero */
      #f2-root #f2-g1 { position: absolute; inset: 0; background: #E85D26; opacity: 0; }
      #f2-root #f2-shake { position: absolute; inset: 0; }
      #f2-root .f2-num { position: absolute; left: 72px; top: 236px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(17,17,17,0.75); }
      #f2-root .f2-title { position: absolute; left: 66px; right: 60px; top: 336px; font-weight: 900; font-size: 180px; line-height: 0.95; letter-spacing: -0.045em; color: #111111; text-transform: lowercase; }
      #f2-root .f2-title div { display: block; }
      #f2-root #f2-t2 { margin-top: 22px; }
      #f2-root #f2-card { position: absolute; left: 150px; top: 720px; width: 780px; height: 780px; background: #F0ECE5; overflow: hidden; }
      #f2-root #f2-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #f2-root .f2-spec { position: absolute; left: 0; right: 0; top: 1300px; height: 190px; display: flex; align-items: center; justify-content: center; }
      #f2-root .f2-spec div { position: absolute; padding: 18px 44px; background: #111111; color: #F0ECE5; font-weight: 900; font-size: 120px; line-height: 1; letter-spacing: -0.04em; text-transform: lowercase; opacity: 0; }
      /* g2 — dark register montage */
      #f2-root #f2-g2 { position: absolute; inset: 0; opacity: 0; }
      #f2-root .f2-use { position: absolute; inset: 0; opacity: 0; }
      #f2-root .f2-use img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      #f2-root .f2-use .f2-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0.95) 0%, rgba(17,17,17,0.7) 30%, rgba(17,17,17,0) 55%); }
      #f2-root .f2-use .f2-lbl { position: absolute; left: 72px; right: 72px; top: 270px; }
      #f2-root .f2-use .f2-k { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: #E85D26; }
      #f2-root .f2-use .f2-rule { width: 72px; height: 6px; background: #E85D26; margin: 22px 0 18px; }
      #f2-root .f2-use .f2-w { font-weight: 900; font-size: 170px; line-height: 0.88; letter-spacing: -0.045em; color: #F0ECE5; text-transform: lowercase; }
      </style>
      <div id="f2-root" data-composition-id="02-f2" data-width="1080" data-height="1920" data-duration="8">
        <div id="f2-g1">
          <div id="f2-shake">
            <div class="f2-num">la solución</div>
            <div class="f2-title"><div id="f2-t1">aeroboost</div><div id="f2-t2">3 en 1</div></div>
            <div id="f2-card"><img id="f2-hero" data-layout-allow-overflow src="assets/public/asp-estudio.jpg" alt="AeroBoost 3 en 1" /></div>
            <div class="f2-spec"><div id="f2-s1">120W</div><div id="f2-s2">sin cables</div><div id="f2-s3">liviana</div></div>
          </div>
        </div>
        <div id="f2-g2">
          <div class="f2-use" id="f2-u1"><img src="assets/public/asp-auto.jpg" alt="" style="object-position: 62% center" /><div class="f2-shade"></div><div class="f2-lbl"><div class="f2-k">úsala en</div><div class="f2-rule"></div><div class="f2-w">el auto</div></div></div>
          <div class="f2-use" id="f2-u2"><img src="assets/public/asp-escritorio.jpg" alt="" style="object-position: 55% center" /><div class="f2-shade"></div><div class="f2-lbl"><div class="f2-k">úsala en</div><div class="f2-rule"></div><div class="f2-w">el escritorio</div></div></div>
          <div class="f2-use" id="f2-u3"><img src="assets/public/asp-guantera.jpg" alt="" /><div class="f2-shade"></div><div class="f2-lbl"><div class="f2-k">compacta</div><div class="f2-rule"></div><div class="f2-w">cabe en la guantera</div></div></div>
          <div class="f2-use" id="f2-u4"><img src="assets/public/asp-filtro.jpg" alt="" /><div class="f2-shade"></div><div class="f2-lbl"><div class="f2-k">fácil de limpiar</div><div class="f2-rule"></div><div class="f2-w">filtro lavable</div></div></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // ---- g1 [local 0 → 3.78]: crash-zoom + braam on the drop, specs swap on beats
        tl.set("#f2-g1", { opacity: 1 }, 0);
        tl.fromTo("#f2-card", { scale: 1.9, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.42, ease: "expo.out" }, 0);
        tl.fromTo("#f2-hero", { scale: 1.15 }, { scale: 1.0, duration: 3.78, ease: "power1.out" }, 0);
        tl.fromTo("#f2-t1", { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" }, 0.02);
        tl.fromTo("#f2-t2", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "elastic.out(1, 0.55)", transformOrigin: "left center" }, 0.3);
        // screen shake on the kick (finite, seek-safe)
        const shakes = [[-18, 10], [14, -12], [-10, 8], [6, -4], [0, 0]];
        shakes.forEach(([x, y], i) => tl.to("#f2-shake", { x, y, duration: 0.04, ease: "none" }, 0.02 + i * 0.04));
        // spec words: 0ms content-swap + braam punch on each anchor (track 4.78 / 5.78 / 6.78)
        const specs = ["#f2-s1", "#f2-s2", "#f2-s3"];
        const at = [0.78, 1.78, 2.78];
        specs.forEach((sel, i) => {
          tl.set(specs, { opacity: 0 }, at[i]);
          tl.set(sel, { opacity: 1 }, at[i]);
          tl.fromTo(sel, { scale: 1.35 }, { scale: 1, duration: 0.36, ease: "back.out(2.4)" }, at[i]);
        });
        tl.set("#f2-g1", { opacity: 0 }, 3.78);
        // ---- g2 [local 3.78 → 8]: beat-cut montage (track 7.78 / 8.78 / 9.78 / 10.77)
        tl.set("#f2-g2", { opacity: 1 }, 3.78);
        const uses = ["#f2-u1", "#f2-u2", "#f2-u3", "#f2-u4"];
        const cuts = [3.78, 4.78, 5.78, 6.77, 8.0];
        uses.forEach((sel, i) => {
          tl.set(uses, { opacity: 0 }, cuts[i]);
          tl.set(sel, { opacity: 1 }, cuts[i]);
          tl.fromTo(sel + " img", { scale: 1.18 }, { scale: 1.06, duration: cuts[i + 1] - cuts[i], ease: "power2.out" }, cuts[i]);
          tl.fromTo(sel + " .f2-w", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.28, ease: "power4.out" }, cuts[i] + 0.02);
          tl.fromTo(sel + " .f2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", transformOrigin: "left center" }, cuts[i]);
        });
        tl.seek(0);
        window.__timelines["02-f2"] = tl;
      </script>
    </template>
  </body>
</html>
