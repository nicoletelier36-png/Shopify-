<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
      @font-face { font-family: "Barlow"; font-weight: 400; src: url("assets/fonts/Barlow-400.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 700; src: url("assets/fonts/Barlow-700.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 800; src: url("assets/fonts/Barlow-800.woff2") format("woff2"); }
      @font-face { font-family: "Barlow"; font-weight: 900; src: url("assets/fonts/Barlow-900.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/IBMPlexMono-500.woff2") format("woff2"); }
      #f1-root { position: absolute; inset: 0; overflow: hidden; background: #111111; font-family: "Barlow", sans-serif; }
      #f1-root .f1-shot { position: absolute; inset: 0; opacity: 0; }
      #f1-root .f1-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
      #f1-root .f1-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0.92) 0%, rgba(17,17,17,0.55) 34%, rgba(17,17,17,0) 58%, rgba(17,17,17,0.35) 100%); }
      #f1-root .f1-copy { position: absolute; left: 72px; right: 72px; top: 270px; }
      #f1-root .f1-kicker { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.14em; text-transform: uppercase; color: #E85D26; margin-bottom: 28px; }
      #f1-root .f1-q { font-weight: 900; font-size: 150px; line-height: 0.88; letter-spacing: -0.04em; color: #F0ECE5; text-transform: lowercase; display: flex; flex-wrap: wrap; column-gap: 34px; }
      #f1-root .f1-q span { display: inline-block; }
      #f1-root .f1-q .f1-hl { color: #E85D26; }
      #f1-root #f1-bar { position: absolute; left: 72px; bottom: 470px; width: 936px; height: 14px; background: #E85D26; transform-origin: left center; }
      #f1-root #f1-flash { position: absolute; inset: 0; background: #E85D26; opacity: 0; }
      </style>
      <div id="f1-root" data-composition-id="01-f1" data-width="1080" data-height="1920" data-duration="4">
        <div class="f1-shot" id="f1-a">
          <img id="f1-a-img" src="assets/public/asp-persona-auto.jpg" alt="" style="object-position: center 65%" />
          <div class="f1-shade"></div>
          <div class="f1-copy">
            <div class="f1-kicker">01 / ¿te pasa?</div>
            <div class="f1-q"><span>¿migas</span><span>en</span><span>el</span><span class="f1-hl">auto?</span></div>
          </div>
        </div>
        <div class="f1-shot" id="f1-b">
          <img id="f1-b-img" src="assets/public/asp-sillon.jpg" alt="" style="object-position: 30% center" />
          <div class="f1-shade"></div>
          <div class="f1-copy">
            <div class="f1-kicker">02 / ¿y esto?</div>
            <div class="f1-q"><span>¿pelos</span><span>en</span><span>el</span><span class="f1-hl">sillón?</span></div>
          </div>
        </div>
        <div id="f1-bar"></div>
        <div id="f1-flash"></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // shot A: 0 → 1.79 (downbeat)
        tl.set("#f1-a", { opacity: 1 }, 0);
        tl.fromTo("#f1-a-img", { scale: 1.12 }, { scale: 1.24, duration: 1.79, ease: "none" }, 0);
        tl.fromTo("#f1-a .f1-q span", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(2)", stagger: 0.12 }, 0.04);
        tl.fromTo("#f1-a .f1-kicker", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0);
        // hard cut on the downbeat
        tl.set("#f1-a", { opacity: 0 }, 1.79);
        tl.set("#f1-b", { opacity: 1 }, 1.79);
        tl.fromTo("#f1-b-img", { scale: 1.14 }, { scale: 1.3, duration: 2.21, ease: "none" }, 1.79);
        tl.fromTo("#f1-b .f1-q span", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "back.out(2)", stagger: 0.12 }, 1.81);
        tl.fromTo("#f1-b .f1-kicker", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.79);
        // riser: the bar fills across the snare roll and lands on the SURGE
        tl.fromTo("#f1-bar", { scaleX: 0 }, { scaleX: 1, duration: 2.0, ease: "power2.in" }, 2.0);
        // lead the drop: orange flood completes on 4.0
        tl.fromTo("#f1-flash", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.in" }, 3.88);
        tl.seek(0);
        window.__timelines["01-f1"] = tl;
      </script>
    </template>
  </body>
</html>
